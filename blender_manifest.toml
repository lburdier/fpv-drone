schema_version = "1.0.0"

id = "fpv_drone"
version = "2.15.0"
name = "FPV Drone"
tagline = "Fly an FPV drone camera with a radio, gamepad, phone or keyboard"
maintainer = "Lucas"
type = "add-on"

website = "https://github.com/lburdier/fpv-drone"

tags = ["Animation", "Camera", "3D View"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = [
  "2026 Lucas",
  "2021 WizardOfRobots (original Quadcopter FPV Simulator)",
  "Project Nayuki (QR Code generator, MIT, vendor/qrcodegen.py)",
]

[permissions]
network = "Phone radio and AI Link for Claude (local servers), GitHub update checks"
clipboard = "Copy the phone link and the Claude setup"
files = "AI Link: writes its port / token and the MCP server to ~/.fpv_drone"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "/docs/", "*.zip"]
